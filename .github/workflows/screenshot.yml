name: 블로그용 화면 캡처

on:
  workflow_dispatch:
    inputs:
      day_time:
        description: "낮 화면 기준 시각 (비우면 지금 화면만)"
        default: "2026-11-20T11:00:00+09:00"

permissions:
  contents: write

jobs:
  shot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - run: sudo apt-get install -y fonts-noto-cjk fonts-noto-color-emoji
      - name: 캡처
        env:
          PAGE_PASSWORD: ${{ secrets.PAGE_PASSWORD }}
          DAY_TIME: ${{ inputs.day_time }}
        run: python tools/screenshot.py
      - name: 캡처 결과를 blog-shots 브랜치에 저장
        run: |
          cd shots
          git init -q -b blog-shots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add . && git commit -qm "blog shots"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" blog-shots
